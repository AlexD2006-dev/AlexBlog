<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Thank You | Alex' Blog</title>
        <link rel="stylesheet" href="/blog/css/style.css" />
        <style>
            .success-box {
                border: 2px solid silver;
                border-radius: 10px;
                padding: 20px 30px;
                max-width: 500px;
                margin: 60px auto;
                text-align: center;
                background-color: rgb(0, 60, 30);
            }

            .success-box h2 {
                color: gold;
                margin-bottom: 10px;
            }

            .success-box p {
                color: silver;
                font-size: 1em;
            }

            .home-btn {
                position: fixed;
                top: 20px;
                right: 20px;
                background-color: silver;
                color: rgb(0, 86, 42);
                padding: 10px 20px;
                border-radius: 5px;
                text-decoration: none;
                font-weight: bold;
            }

            .home-btn:hover {
                background-color: gold;
            }
        </style>
    </head>
    <body>
        <a href="/" class="home-btn">← Back to Home</a>

        <main>
            <div class="success-box">
                <h2>✅ Message Received!</h2>
                <p>Thank you for reaching out! We will be in touch with you soon.</p>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Alex' Blog. All rights reserved.</p>
        </footer>
    </body>
</html>
